<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Docs</title> <!-- Tab Cloak -->
    <link rel="icon" type="image/x-icon" href="https://gstatic.com"> 
    <script src="https://jsdelivr.net"></script>
    <script src="/studdy-app/uv.config.js"></script>
</head>
<body style="background-color: #121212; color: white; font-family: Arial, sans-serif; text-align: center; margin-top: 15%;">

    <h1>Workspace Hub</h1>
    <p>Enter a web destination below</p>
    
    <div style="margin-top: 20px;">
        <input type="text" id="urlInput" placeholder="Enter URL or search term..." style="width: 350px; padding: 12px; border-radius: 5px; border: none; font-size: 16px;">
        <button id="btnSearch" style="padding: 12px 20px; border-radius: 5px; border: none; background-color: #2463EB; color: white; font-size: 16px; cursor: pointer; margin-left: 10px;">Connect</button>
    </div>

    <script>
        // Start up the core interceptor engine
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/studdy-app/uv.sw.js', {
                    scope: __uv$config.prefix
                }).then(() => console.log("Engine connected successfully."));
            });
        }

        const input = document.getElementById('urlInput');
        const button = document.getElementById('btnSearch');

        function formatUrl(val) {
            let url = val.trim();
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            if (url.includes('.') && !url.includes(' ')) return 'https://' + url;
            return 'https://google.com' + encodeURIComponent(url);
        }

        button.onclick = function() {
            const cleanUrl = formatUrl(input.value);
            const proxyUrl = window.location.origin + __uv$config.prefix + __uv$config.encodeUrl(cleanUrl);
            
            const win = window.open();
            if (!win) {
                alert("Pop-up blocked! Please look at your address bar and allow pop-ups for this site.");
                return;
            }
            win.document.body.style.margin = '0';
            win.document.body.style.height = '100vh';
            
            const iframe = win.document.createElement('iframe');
            iframe.style.border = 'none';
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.src = proxyUrl;
            
            win.document.body.appendChild(iframe);
        };
    </script>
</body>
</html>
